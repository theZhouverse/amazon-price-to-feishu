# Amazon Daily — price-only Docker deployment
# 启动：docker compose -f deploy/docker/docker-compose.yml up -d --build
services:
  amazon-daily:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: amazon-daily:latest
    container_name: amazon_daily
    restart: unless-stopped
    # Dockerfile 已以 tini 作为 PID 1；不要再设置 compose init，否则会形成
    # 双重 tini 包装并产生“not PID 1”警告。
    environment:
      # Secret 运行时注入（优先级高于 .env 文件），不要写死在 compose 里
      FS_APP_SECRET: "${FS_APP_SECRET:-}"
      TZ: Asia/Shanghai
      # 容器内路径必须使用 POSIX 路径；默认关闭 HTML，价格任务不依赖归档。
      AMAZON_HTML_ARCHIVE_ROOT: /app/htmls
      AMAZON_HTML_ARCHIVE_ENABLED: "${AMAZON_HTML_ARCHIVE_ENABLED:-false}"
      AMAZON_HTML_ARCHIVE_REQUIRED: "${AMAZON_HTML_ARCHIVE_REQUIRED:-false}"
      AMAZON_HTML_SERVER_ENABLED: "${AMAZON_HTML_SERVER_ENABLED:-false}"
      AMAZON_HTML_SERVER_BIND: "${AMAZON_HTML_SERVER_BIND:-0.0.0.0}"
      AMAZON_HTML_SERVER_PORT: "${AMAZON_HTML_SERVER_PORT:-8765}"
      AMAZON_WORKERS: "${AMAZON_WORKERS:-4}"
    volumes:
      # 必须持久化：固定表登记/最新批次/首次发现账本/周 manifest/逐表 bundle/备份/回执/日志
      - ./volumes/outputs:/app/outputs
      # 本地数据与临时目录
      - ./volumes/data:/app/data
      # HTML is optional but kept on its own volume when enabled later.
      - ./volumes/htmls:/app/htmls
      # 非敏感配置（config.json 禁止包含 secret）
      - ${AMAZON_CONFIG_FILE:-../../config/config.json}:/app/config/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/cron.d/amazon-daily && pgrep -x cron >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 说明：容器出口 IP 即抓取 Amazon 的出口 IP。
    # 若在本机 Docker Desktop（宿主固定 VPN 生效）运行，出口与现网一致；
    # 若在云端 Linux 服务器运行，Amazon 可能对数据中心 IP 高概率弹验证码/拦截，
    # 程序只会记录风险，不会自动换 IP。需要自行评估出口网络。
